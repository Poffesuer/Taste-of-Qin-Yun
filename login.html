<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="main">
    <div class="form-box">

      <form id="loginForm">
        <h2>Login</h2>

        <div class="input-group">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" placeholder="Enter username" required />
        </div>

        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password" required />
        </div>

        <button type="submit" class="btn">Login</button>

        <p class="switch-text">
          No account？
          <a href="#" id="showRegister">Register</a>
        </p>
      </form>

      <form id="registerForm" class="hidden">
        <h2>Register</h2>

        <div class="input-group">
          <label for="registerUsername">Username</label>
          <input type="text" id="registerUsername" placeholder="Create username" required />
        </div>

        <div class="input-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" placeholder="Enter email" required />
        </div>

        <div class="input-group">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" placeholder="Create password" required />
        </div>

        <button type="submit" class="btn">Register</button>

        <p class="switch-text">
          Already have an account？
          <a href="#" id="showLogin">Login</a>
        </p>
      </form>

      <p class="message" id="message"></p>
    </div>
  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const showRegister = document.getElementById("showRegister");
    const showLogin = document.getElementById("showLogin");
    const message = document.getElementById("message");

    showRegister.addEventListener("click", function (e) {
      e.preventDefault();
      loginForm.classList.add("hidden");
      registerForm.classList.remove("hidden");
      message.textContent = "";
    });

    showLogin.addEventListener("click", function (e) {
      e.preventDefault();
      registerForm.classList.add("hidden");
      loginForm.classList.remove("hidden");
      message.textContent = "";
    });

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();
      message.textContent = "Login successful";
    });

    registerForm.addEventListener("submit", function (e) {
      e.preventDefault();
      message.textContent = "registeration successful";
      registerForm.classList.add("hidden");
      loginForm.classList.remove("hidden");
    });
  </script>

</body>

</html>
